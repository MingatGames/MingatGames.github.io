<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nomad Life</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="./assets/index-BeZm_VDI.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CJfWZw93.css">
  </head>
  <body>
    <div id="loading-screen">
      <div class="loader-content">
        <h1>Nomad Life</h1>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <p id="loading-text">Initializing World...</p>
      </div>
    </div>

    <div id="ui-layer" style="display: none;">
      <div id="stamina-container">
        <div id="stamina-bar"></div>
      </div>
      
      <div id="time-dial">
        <div id="sun-moon-indicator"></div>
        <span id="time-text">12:00</span>
      </div>

      <div id="herd-status">
        <span>Herd Safe: </span>
        <span id="herd-count">0/0</span>
      </div>

      <div id="interaction-prompt" class="hidden">
        <span class="key-hint">E</span>
        <span id="interaction-text">Interact</span>
      </div>

      <div id="controls-hint">
        <div>WASD to Move</div>
        <div>SHIFT to Run</div>
        <div>E to Interact/Mount</div>
        <div>C to Switch Character</div>
      </div>
    </div>

    <canvas id="game-canvas"></canvas>
  </body>
</html>
